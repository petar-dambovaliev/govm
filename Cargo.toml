[package]
name = "gno-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = {version = "0.24.1", features = ["derive"]}
unic-ucd-category = {version = "0.9.0"}
ahash = "0.8.3"
num = "0.4.1"
clap = {version = "4.*", features = ["derive", "default"]}
reqwest = {version = "0.11", features = ["blocking"]}
git2 = "0.13"
regex = "1.10.2"
md5 = "0.7.0"
rand = "0.8.5"
glob = "0.3.0"
lazy-regex = "3.1.0"
lazy_static = "1.4.0"
chrono = "0.4.31"
rust_decimal = "1.33.1"
tokio = {version = "1", features = ["full"]}
async-channel = "2"
wasm-encoder = "0.243"
wasmtime = "41.0.3"

[profile.dev]
panic = "unwind"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
wasmprinter = "0.243"
wasmparser = "0.243"

[[bench]]
name = "fibonacci"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
debug = true

[profile.bench]
debug = true