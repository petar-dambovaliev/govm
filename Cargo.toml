[package]
name = "gno-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
strum = {version = "0.24.1", features = ["derive"]}
unic-ucd-category = {version = "0.9.0"}
ahash = "0.8.3"
num = "0.4.1"
bdwgc-alloc = {git = "https://github.com/peter7891/bdwgc-alloc", branch = "main", features = ["cmake"], default-features = false}
dep-graph = "0.2.0"
clap = {version = "4.*", features = ["derive", "default"]}
reqwest = {version = "0.11", features = ["blocking"]}
git2 = "0.13"
regex = "1.10.2"
md5 = "0.7.0"
rand = "0.8.5"
glob = "0.3.0"
lazy-regex = "3.1.0"
lazy_static = "1.4.0"
chrono = "0.4.31"

[debug]
panic = "unwind"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "fibonacci"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
debug = true

[profile.bench]
debug = true