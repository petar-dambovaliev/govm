[package]
name = "gno-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { version = "0.24.1", features = ["derive"] }
unic-ucd-category = { version = "0.9.0" }
ahash = "0.8.3"
num = "0.4.1"
clap = { version = "4.*", features = ["derive", "default"] }
regex = "1.10.2"
lazy-regex = "3.1.0"
lazy_static = "1.4.0"
wasmtime = "29"
wasm-encoder = "0.225"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
panic = "unwind"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
debug = true
